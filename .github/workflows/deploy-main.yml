name: Deploy main to production site

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx vue-cli-service build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::988218197909:role/cause-frontend-github-actions
          aws-region: eu-west-2

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://causef.jamiebuckell.co.uk/ --only-show-errors

      - name: Invalidate production site cache
        run: aws cloudfront create-invalidation --distribution-id E3S4Z05K6XBLYL --paths '/*'
