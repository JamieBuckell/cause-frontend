name: Deploy dev to development site

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx vue-cli-service build
        env:
          VUE_APP_ENVIRONMENT: dev
          VUE_APP_COMMIT_SHA: ${{ github.sha }}
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::988218197909:role/cause-frontend-dev-github-actions
          aws-region: eu-west-2

      - name: Deploy fingerprinted assets to S3
        run: >-
          aws s3 sync dist/ s3://causef.jamiebuckell.co.uk/development/
          --exclude '*.html'
          --exclude 'version.json'
          --exclude 'donors/register'
          --cache-control 'public,max-age=31536000,immutable'
          --only-show-errors

      - name: Deploy HTML entry points without caching
        run: >-
          aws s3 cp dist/ s3://causef.jamiebuckell.co.uk/development/
          --recursive
          --exclude '*'
          --include '*.html'
          --content-type 'text/html; charset=utf-8'
          --cache-control 'no-cache,no-store,must-revalidate'
          --only-show-errors

      - name: Deploy application version without caching
        run: >-
          aws s3 cp dist/version.json s3://causef.jamiebuckell.co.uk/development/version.json
          --content-type 'application/json; charset=utf-8'
          --cache-control 'no-cache,no-store,must-revalidate'
          --only-show-errors

      # The registration URL has no extension, so S3 cannot infer its MIME type.
      - name: Set registration page content type
        run: >-
          aws s3 cp dist/donors/register s3://causef.jamiebuckell.co.uk/development/donors/register
          --content-type 'text/html; charset=utf-8'
          --cache-control 'no-cache,no-store,must-revalidate'
          --only-show-errors

      - name: Invalidate development site cache
        run: aws cloudfront create-invalidation --distribution-id E2G9Q9M0SNBI07 --paths '/*'
